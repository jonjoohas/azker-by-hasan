<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الأذكار</title>
  
  <!-- أيقونة الموقع للمتصفح والجوال -->
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10B981">
  
  <!-- Tailwind CSS -->
  <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">

  <style>
    @import url('[https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap](https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap)');
    
    * {
      font-family: 'Tajawal', sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .bg-slider {
      transition: opacity 1.2s ease-in-out;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;
    }

    .glass-box {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }
  </style>
</head>
<body class="relative w-screen h-screen overflow-x-hidden overflow-y-auto bg-black text-white">

  <!-- طبقات خلفية السلايدر -->
  <div id="bg-layer-1" class="bg-slider fixed inset-0 opacity-100"></div>
  <div id="bg-layer-2" class="bg-slider fixed inset-0 opacity-0"></div>

  <!-- تظليل خفيف -->
  <div class="fixed inset-0 bg-black/35"></div>

  <!-- الحاوية الرئيسية -->
  <div class="relative z-10 min-h-screen w-full flex flex-col justify-between p-4 sm:p-6 md:p-8 gap-6">

    <!-- 1. القسم العلوي: الساعة والطقس -->
    <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-start w-full gap-3 sm:gap-4">
      
      <!-- الساعة والتاريخ -->
      <div class="glass-box p-4 rounded-2xl flex flex-col items-center justify-center shadow-2xl min-w-[220px]">
        <div id="clock-time" class="text-3xl sm:text-4xl font-extrabold tracking-widest font-mono text-white">00:00:00</div>
        <div id="gregorian-date" class="text-xs sm:text-sm font-medium text-slate-300 mt-1">--</div>
        <div id="hijri-date" class="text-xs font-bold text-emerald-400 mt-1">جاري التحميل...</div>
      </div>

      <!-- الطقس والموقع (حلب، سوريا) -->
      <div class="glass-box p-4 rounded-2xl flex flex-col items-center sm:items-end justify-center shadow-2xl min-w-[200px]">
        <div class="text-xl sm:text-2xl font-extrabold text-white mb-1">الطقس</div>
        <div class="flex items-center gap-2 sm:gap-3">
          <i id="weather-icon" class="fa-solid fa-sun text-2xl text-amber-400"></i>
          <span id="weather-temp" class="text-2xl font-bold">--°C</span>
        </div>
        <div id="weather-desc" class="text-xs text-slate-300 mt-1 font-medium">جاري جلب الطقس...</div>
        <div class="text-xs sm:text-sm font-extrabold text-emerald-400 mt-2 flex items-center gap-1.5">
          <i class="fa-solid fa-location-dot"></i>
          <span id="location-name">حلب، سوريا</span>
        </div>
      </div>

    </div>

    <!-- 2. القسم الأوسط: مشغل الأذكار (القارئ علاء عقل) -->
    <div class="flex justify-center w-full my-auto">
      <div class="glass-box p-4 rounded-2xl flex items-center justify-between gap-4 w-full sm:w-auto min-w-[280px] max-w-md shadow-2xl">
        
        <div class="flex items-center gap-2 text-emerald-400 font-bold text-sm sm:text-base">
          <i class="fa-solid fa-microphone"></i>
          <span>القارئ علاء عقل</span>
        </div>

        <button id="play-btn" class="bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white px-6 py-2.5 rounded-xl text-xs sm:text-sm font-bold flex items-center justify-center gap-2 transition active:scale-95 shadow-md">
          <i id="play-icon" class="fa-solid fa-play"></i>
          <span id="play-text">تشغيل</span>
        </button>

      </div>
    </div>

    <!-- 3. القسم السفلي: التحكم بالسلايدر والإهداء -->
    <div class="flex flex-col-reverse sm:flex-row justify-between items-center sm:items-end w-full gap-4">

      <div class="w-48 hidden md:block"></div>

      <!-- أزرار تحكم السلايدر -->
      <div class="glass-box p-2 rounded-2xl flex items-center justify-center gap-3 px-4 shadow-2xl w-full sm:w-auto">
        <button onclick="prevWallpaper()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-chevron-right"></i>
        </button>
        <button id="slide-toggle-btn" onclick="toggleAutoSlide()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center text-white transition">
          <i id="slide-toggle-icon" class="fa-solid fa-pause"></i>
        </button>
        <button onclick="nextWallpaper()" class="w-10 h-10 rounded-xl bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center text-white transition">
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      </div>

      <!-- كارت الإهداء والتبريك -->
      <div class="glass-box px-4 py-2.5 rounded-2xl flex items-center gap-3 shadow-2xl w-full sm:w-auto justify-center sm:justify-start">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <div class="flex flex-col text-right">
          <span class="text-xl sm:text-sm font-extrabold text-white">اللهم صلي على سيدنا محمد</span>
          <span class="text-[10px] sm:text-xl font-semibold text-slate-300">المهندس حسن كلاوي</span>
        </div>
      </div>

    </div>

  </div>

  <!-- مشغل الصوتيات (تم تصحيحه) -->
  <audio id="main-audio" src="أذكار الصباح - لاالقارئ علاء عقل _ (MP3_128K).mp3"></audio>

  <script>
    // 1. تسجيل ملف الخدمة للـ PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    // 2. خلفيات الحرم المكي الشريف
    const WALLPAPERS = [
      '[https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?q=80&w=2000&auto=format&fit=crop](https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?q=80&w=2000&auto=format&fit=crop)',
      '[https://images.unsplash.com/photo-1565552645632-d725f8bfc19a?q=80&w=2000&auto=format&fit=crop](https://images.unsplash.com/photo-1565552645632-d725f8bfc19a?q=80&w=2000&auto=format&fit=crop)',
      '[https://images.unsplash.com/photo-1542810634-71277d95dcbb?q=80&w=2000&auto=format&fit=crop](https://images.unsplash.com/photo-1542810634-71277d95dcbb?q=80&w=2000&auto=format&fit=crop)',
      '[https://images.unsplash.com/photo-1580418827493-f2b22c0a76cb?q=80&w=2000&auto=format&fit=crop](https://images.unsplash.com/photo-1580418827493-f2b22c0a76cb?q=80&w=2000&auto=format&fit=crop)'
    ];

    let currentBgIndex = 0;
    let activeLayer = 1;
    let autoSlideInterval = null;
    let isAutoSlideActive = true;

    document.getElementById('bg-layer-1').style.backgroundImage = "url('" + WALLPAPERS[0] + "')";

    function changeWallpaper(index) {
      const nextUrl = WALLPAPERS[index];
      const layer1 = document.getElementById('bg-layer-1');
      const layer2 = document.getElementById('bg-layer-2');

      if (activeLayer === 1) {
        layer2.style.backgroundImage = "url('" + nextUrl + "')";
        layer2.style.opacity = '1';
        layer1.style.opacity = '0';
        activeLayer = 2;
      } else {
        layer1.style.backgroundImage = "url('" + nextUrl + "')";
        layer1.style.opacity = '1';
        layer2.style.opacity = '0';
        activeLayer = 1;
      }
    }

    function nextWallpaper() {
      currentBgIndex = (currentBgIndex + 1) % WALLPAPERS.length;
      changeWallpaper(currentBgIndex);
    }

    function prevWallpaper() {
      currentBgIndex = (currentBgIndex - 1 + WALLPAPERS.length) % WALLPAPERS.length;
      changeWallpaper(currentBgIndex);
    }

    function toggleAutoSlide() {
      const icon = document.getElementById('slide-toggle-icon');
      if (isAutoSlideActive) {
        clearInterval(autoSlideInterval);
        icon.className = 'fa-solid fa-play';
      } else {
        autoSlideInterval = setInterval(nextWallpaper, 8000);
        icon.className = 'fa-solid fa-pause';
      }
      isAutoSlideActive = !isAutoSlideActive;
    }

    autoSlideInterval = setInterval(nextWallpaper, 8000);

    // 3. الساعة والتاريخ
    function updateClockAndDates() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('clock-time').innerText = hours + ':' + minutes + ':'
